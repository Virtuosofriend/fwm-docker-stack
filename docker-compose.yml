version: "3.5"

services:
  database:
    image: postgis/postgis:15-3.3
    container_name: fwm-postgres
    restart: always
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
    shm_size: 256mb
    ports:
      - "5432:5432"
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_MULTIPLE_EXTENSIONS: postgis
    volumes:
      - ../data/database/:/var/lib/postgresql/data
    networks:
      - directus

  cache:
    container_name: fwm-cache
    restart: always
    image: redis:6
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    mem_limit: 256m
    networks:
      - directus

  directus:
    image: directus/directus:${DIRECTUS_VERSION}
    container_name: fwm-directus
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - 8055:8055
    volumes:
      - ../data/cms/uploads:/directus/uploads
      - ../data/cms/extensions:/directus/extensions
    depends_on:
      - database
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      LICENSE_KEY: ${DIRECTUS_LICENSE_KEY}
      PUBLIC_URL: "http://localhost:8055"

      ACCESS_TOKEN_TTL: "15m"
      EXTENSIONS_AUTO_RELOAD: "true"
      REFRESH_TOKEN_TTL: "365d"
      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: "redis"
      # RETENTION_ENABLED: "true"
      # ACTIVITY_RETENTION: "60d"
      # REVISIONS_RETENTION: "60d"
      # FLOW_LOGS_RETENTION: "30d"
      REDIS: "redis://cache:6379"
      FILES_MAX_UPLOAD_SIZE: "10mb"
      MAX_PAYLOAD_SIZE: "10mb"
      NODE_OPTIONS: "--max-old-space-size=768"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - directus

  node:
    build:
      context: ./fwm-crawlers
      dockerfile: prod.Dockerfile
      args:
        EXPRESS_PORT: ${EXPRESS_PORT}
        DIRECTUS_API: ${DIRECTUS_API}
        OPENWEATHER_KEY: ${OPENWEATHER_KEY}
        DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
        FORECAST_OUTPUT_JSON_FOLDER: ${FORECAST_OUTPUT_JSON_FOLDER}
        BSKY_USERNAME: ${BSKY_USERNAME}
        BSKY_PASSWORD: ${BSKY_PASSWORD}
    container_name: fwm-crawlers
    restart: unless-stopped
    hostname: fwm-crawlers
    mem_limit: 768m
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - ${EXPRESS_PORT}:${EXPRESS_PORT}
    volumes:
      - ../fwm-crawlers/:/app/
      - ../data/forecasts/:/app/forecasts/
    networks:
      - directus

networks:
  directus:
    name: directus
    driver: bridge
