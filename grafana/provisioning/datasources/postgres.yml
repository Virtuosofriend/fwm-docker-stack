apiVersion: 1

datasources:
  - name: FWM Postgres
    uid: fwm-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: database:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: ${FWM_DB_NAME}
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
    secureJsonData:
      password: ${FWM_DB_READER_PASSWORD}
