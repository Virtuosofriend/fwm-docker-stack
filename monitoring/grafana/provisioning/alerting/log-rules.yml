apiVersion: 1

# Paused until the normal error level per type is known (2–3 days of logs), then set the threshold and unpause.
groups:
  - orgId: 1
    name: Crawler logs
    folder: FWM
    interval: 5m
    rules:
      - uid: fwm-crawler-errors
        title: Crawler errors
        isPaused: true
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fwm-loki
            model:
              refId: A
              queryType: instant
              editorMode: code
              expr: |
                sum by (station_type) (
                  count_over_time({container="fwm-crawlers", level=~"error|fatal"} | json station_type="stationType" [15m])
                )
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [10] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: '{{ if .Labels.station_type }}{{ .Labels.station_type }}{{ else }}fwm-crawlers (other){{ end }}: {{ printf "%.0f" .Values.B.Value }} errors in the last 15 min'
