apiVersion: 1

groups:
  - orgId: 1
    name: Server
    folder: FWM
    interval: 1m
    rules:
      - uid: fwm-container-memory
        title: Container memory high
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fwm-prometheus
            model:
              refId: A
              instant: true
              range: false
              editorMode: code
              expr: |
                max by (name) (
                  100 * container_memory_working_set_bytes{name=~".+"}
                    / (container_spec_memory_limit_bytes{name=~".+"} > 0)
                )
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [80] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ .Labels.name }}: memory at {{ printf "%.0f" .Values.B.Value }}% of its limit'

      - uid: fwm-disk-space
        title: Disk almost full
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fwm-prometheus
            model:
              refId: A
              instant: true
              range: false
              editorMode: code
              expr: |
                min by (mountpoint) (
                  100 * node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}
                    / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}
                )
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [15] }
        noDataState: NoData
        execErrState: Error
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'Disk {{ .Labels.mountpoint }}: only {{ printf "%.0f" .Values.B.Value }}% free'

      - uid: fwm-server-memory
        title: Server memory low
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fwm-prometheus
            model:
              refId: A
              instant: true
              range: false
              editorMode: code
              expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [10] }
        noDataState: NoData
        execErrState: Error
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'Server memory: only {{ printf "%.0f" .Values.B.Value }}% available (no swap)'

      - uid: fwm-crawler-unreachable
        title: Crawler unreachable
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fwm-prometheus
            model:
              refId: A
              instant: true
              range: false
              editorMode: code
              expr: up{job="crawlers"}
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "fwm-crawlers: metrics unreachable for 5 min (the crawler is down or restarting)"
