services:
  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION}
    container_name: fwm-grafana
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ../../data/grafana/:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://grafana.myweathr.com"
      GF_SECURITY_COOKIE_SECURE: "true"
      FWM_DB_NAME: ${DB_DATABASE}
      FWM_DB_READER_PASSWORD: ${GRAFANA_DB_PASSWORD}
      VIRTUAL_HOST: "grafana.myweathr.com"
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: "grafana.myweathr.com"
      LETSENCRYPT_EMAIL: "mitssak@hotmail.com"
    networks:
      - directus
      - nginx-proxy
      - monitoring

  loki:
    image: grafana/loki:${LOKI_VERSION}
    container_name: fwm-loki
    restart: unless-stopped
    mem_limit: 512m
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ../../data/loki/:/loki
      - ./loki/config.yml:/etc/loki/config.yml:ro
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:${ALLOY_VERSION}
    container_name: fwm-alloy
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - loki
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    volumes:
      - ../../data/alloy/:/var/lib/alloy/data
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring

networks:
  directus:
    external: true
  nginx-proxy:
    external: true
  monitoring:
    internal: true
