services:
  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION}
    container_name: fwm-grafana
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ../../data/grafana/:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://grafana.myweathr.com"
      GF_SECURITY_COOKIE_SECURE: "true"
      FWM_DB_NAME: ${DB_DATABASE}
      FWM_DB_READER_PASSWORD: ${GRAFANA_DB_PASSWORD}
      VIRTUAL_HOST: "grafana.myweathr.com"
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: "grafana.myweathr.com"
      LETSENCRYPT_EMAIL: "mitssak@hotmail.com"
    networks:
      - directus
      - nginx-proxy
      - monitoring

  loki:
    image: grafana/loki:${LOKI_VERSION}
    container_name: fwm-loki
    restart: unless-stopped
    mem_limit: 512m
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ../../data/loki/:/loki
      - ./loki/config.yml:/etc/loki/config.yml:ro
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:${ALLOY_VERSION}
    container_name: fwm-alloy
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - loki
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    volumes:
      - ../../data/alloy/:/var/lib/alloy/data
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: fwm-prometheus
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=21d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ../../data/prometheus/:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring
      - directus

  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION}
    container_name: fwm-cadvisor
    restart: unless-stopped
    mem_limit: 192m
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,cpuset,advtcp,memory_numa,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    container_name: fwm-node-exporter
    restart: unless-stopped
    mem_limit: 64m
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

networks:
  directus:
    external: true
  nginx-proxy:
    external: true
  monitoring:
    internal: true
